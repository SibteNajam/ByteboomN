<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balanced Trading Engine card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BOT VERSION CARD — drop-in. Everything is scoped to .bot-card
   ============================================================ */
.bot-card{
  --bc-accent:#00d9f5;
  --bc-ink:#f5f7fa;
  --bc-body:#a9b7c2;
  --bc-label:#93a3b0;
  --bc-quiet:#6f7d8a;
  --bc-shell-top:#04131a;
  --bc-shell-bottom:#01080d;

  position:relative;
  display:flex;
  flex-direction:column;
  width:440px;
  max-width:100%;
  margin-top:12px;                     /* room for the notched tag */
  border-radius:26px;
  border:1px solid rgba(0,217,245,.5);
  background:
    radial-gradient(ellipse 70% 40% at 50% 16%,rgba(0,217,245,.06),transparent 70%),
    linear-gradient(180deg,var(--bc-shell-top) 0%,var(--bc-shell-bottom) 100%);
  box-shadow:
    inset 0 1px 0 rgba(180,240,255,.09),
    0 0 32px rgba(0,217,245,.07),
    0 18px 44px rgba(0,0,0,.6);
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;
}
.bot-card:hover{
  transform:translateY(-4px);
  box-shadow:
    inset 0 1px 0 rgba(180,240,255,.12),
    0 0 46px rgba(0,217,245,.15),
    0 26px 60px rgba(0,0,0,.7);
}

/* notched tag — the ring is the card ground punched through the border */
.bot-card__tag{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:3;
  display:grid;place-items:center;height:22px;padding:0 12px;
  border-radius:6px;border:1px solid rgba(0,217,245,.45);
  background:#062a34;color:#8fe9fb;
  font-size:10px;font-weight:500;line-height:1;
  letter-spacing:.14em;text-indent:.14em;
  box-shadow:0 0 0 4px var(--bc-shell-top);
}

.bot-card__head{position:relative;z-index:2;display:flex;align-items:center;gap:9px;padding:22px 24px 0}
.bot-card__dot{position:relative;display:grid;place-items:center;width:14px;height:14px}
.bot-card__dot i{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(0,217,245,.35);animation:bcHalo 2.6s ease-in-out infinite}
.bot-card__dot b{position:relative;width:9px;height:9px;border-radius:50%;background:var(--bc-accent);animation:bcPulse 2.6s ease-in-out infinite}
.bot-card__mult{color:rgba(0,217,245,.9);font-size:13px;font-weight:500;line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums}

.bot-card__art{position:relative;height:214px;margin-top:-8px}
.bot-card__art svg.bot-card__wires{position:absolute;inset:0;width:100%;height:100%}
.bot-card__chip{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:grid;place-items:center;width:124px;height:124px;border-radius:22px;
  border:1px solid rgba(0,217,245,.7);
  background:linear-gradient(160deg,rgba(0,217,245,.09),rgba(0,30,40,0)),rgba(0,35,45,.5);
  box-shadow:0 0 26px rgba(0,217,245,.14),inset 0 0 22px rgba(0,217,245,.05);
}

.bot-card__body{display:flex;flex-direction:column;text-align:center;padding:2px 34px 32px}
.bot-card__kicker{margin:0 0 9px;color:rgba(0,217,245,.85);font-size:12px;font-weight:500;line-height:1.2;letter-spacing:.14em;text-transform:uppercase}
.bot-card__title{margin:0 0 11px;color:var(--bc-ink);font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.bot-card__desc{margin:0;color:var(--bc-body);font-size:14.5px;line-height:1.6;text-wrap:pretty}
.bot-card__rule{height:1px;margin:24px 0 20px;background:linear-gradient(to right,transparent,rgba(0,217,245,.38) 22%,rgba(0,217,245,.38) 78%,transparent)}

.bot-card__specs{display:flex;flex-direction:column;gap:14px;margin:0}
.bot-card__specs > div{display:grid;grid-template-columns:1fr auto;align-items:center}
.bot-card__specs dt{color:var(--bc-label);font-size:14px;text-align:left}
.bot-card__specs dd{margin:0;font-size:14px;font-weight:600}
.bot-card__specs dd.is-med{color:#f2d600}
.bot-card__specs dd.is-high{color:#00e676}
.bot-card__specs dd.is-info{color:var(--bc-accent)}

.bot-card__cta{
  margin-top:24px;width:100%;height:44px;border-radius:12px;
  border:1px solid rgba(0,217,245,.6);background:rgba(0,217,245,.05);
  color:#c8f6ff;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.02em;
  cursor:pointer;outline:none;
  transition:background .2s,border-color .2s,box-shadow .2s;
}
.bot-card__cta:hover{background:rgba(0,217,245,.13);border-color:rgba(0,217,245,.9)}
.bot-card__cta:active{background:rgba(0,217,245,.2)}
.bot-card__cta:focus-visible{box-shadow:0 0 0 2px rgba(0,217,245,.5);border-color:rgba(0,217,245,.9)}
.bot-card__note{margin:16px 0 0;color:var(--bc-quiet);font-size:12.5px;line-height:1.45}

@keyframes bcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
@keyframes bcHalo{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.85;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){
  .bot-card,.bot-card__dot i,.bot-card__dot b{transition:none;animation:none}
}
@media (max-width:480px){
  .bot-card{width:100%}
  .bot-card__art{height:180px}
  .bot-card__title{font-size:28px}
}

/* demo page only — delete */
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:60px 20px;background:#0e1018}
</style>
</head>
<body>

<article class="bot-card">
  <span class="bot-card__tag">RECOMMENDED</span>

  <header class="bot-card__head">
    <span class="bot-card__dot"><i></i><b></b></span>
    <span class="bot-card__mult">0.5&times;</span>

        <path d="M357 218 L375.05 199.95 Q380 195 387 195 L421 195 Q428 195 432.95 190.05 L441.05 181.95 Q446 177 453 177 L480 177"/>
        <path d="M357 218 L375.05 236.05 Q380 241 387 241 L421 241 Q428 241 432.95 245.95 L441.05 254.05 Q446 259 453 259 L480 259"/>
        <path d="M357 218 L357 244 Q357 251 361.95 255.95 L375.05 269.05 Q380 274 380 281 L380 356"/>

        <path d="M315 293 L326.05 304.05 Q331 309 331 316 L331 338"/>
        <path d="M357 218 L318 218"/>
      </g>
      <g fill="#f7fafc" style="filter:drop-shadow(0 0 6px rgba(220,245,255,.45))">
        <circle cx="123" cy="218" r="9"></circle>
        <circle cx="357" cy="218" r="9"></circle>
      </g>
    </svg>

    <div class="bot-card__chip">
      <svg viewBox="0 0 96 96" width="72" height="72" fill="none" stroke="#eafbff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px rgba(0,217,245,.4))" aria-hidden="true">
        <circle cx="48" cy="14" r="4"></circle>
        <path d="M48 18v58"></path><path d="M15 28h66"></path>
        <path d="M15 28 4 54h22z"></path><path d="M81 28 70 54h22z"></path>
        <path d="M4 54a11 11 0 0 0 22 0"></path><path d="M70 54a11 11 0 0 0 22 0"></path>
        <path d="M34 76h28"></path><path d="M26 86h44"></path><path d="M34 86l3-10M62 86l-3-10"></path>
      </svg>
    </div>
  </div>

  <div class="bot-card__body">
    <p class="bot-card__kicker">% Balanced</p>
    <h3 class="bot-card__title">Balanced Trading Engine</h3>
    <p class="bot-card__desc">Balanced risk &amp; reward<br>Consistent PnL growth</p>

    <div class="bot-card__rule"></div>

    <dl class="bot-card__specs">
      <div><dt>Risk Level</dt><dd class="is-med">Medium</dd></div>
      <div><dt>Profit Potential</dt><dd class="is-high">High</dd></div>
      <div><dt>Trade Frequency</dt><dd class="is-info">Medium</dd></div>
    </dl>

    <button type="button" class="bot-card__cta">Start Balanced Engine</button>
    <p class="bot-card__note">Best balance for steady growth</p>
  </div>
</article>

</body>
</html>
